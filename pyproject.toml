[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="nexaworks"
version="0.1.0"
description="NexaWorks operations decision support tool"
requires-python=">=3.11"

[tool.setuptools.packages.find]
include=["nexaworks*"]

[tool.pytest.ini_options]
pythonpath = ["."]
